<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Photo-rich farm showcase and clearer interaction affordances */
.photo-showcase{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
.photo-tile{position:relative;min-height:160px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface2);isolation:isolate}
.photo-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s ease,filter .3s ease}
.photo-tile:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(transparent,rgba(8,24,14,.88));z-index:-0;pointer-events:none}
.photo-tile:hover img{transform:scale(1.055);filter:saturate(1.1)}
.photo-tile .photo-copy{position:absolute;left:14px;right:14px;bottom:13px;color:#fff;z-index:1;text-shadow:0 1px 5px #0008}
.photo-copy small{display:block;font:500 10px var(--f-mono);letter-spacing:.13em;text-transform:uppercase;opacity:.82}
.photo-copy b{display:block;font:700 20px/1.1 var(--f-display);margin:4px 0 8px}
.photo-tile button{border:1px solid #ffffff9c;background:#ffffffeb;color:#183523;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;text-shadow:none;min-height:32px}
.photo-tile button:hover{background:#fff}
.visual-note{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:12px}
.visual-note svg{width:16px;height:16px;flex:none}
@media(max-width:620px){.photo-showcase{grid-template-columns:1fr;gap:9px}.photo-tile{min-height:145px}.photo-copy b{font-size:18px}}

</style></head><body>
<title>Tilth Farm Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a season-tinted header band over a tabbed ledger. Each farm opens on an illustrated landscape, a field-work panel where machines do the jobs, and a grid of drawn plots. */
:root{
  --bg:#E7ECE2;--surface:#F5F7F1;--surface2:#DCE4D5;--ink:#16231A;--muted:#566559;--line:#C2CDBA;
  --accent:#1F6B45;--accent-ink:#F5F7F1;--gold:#946010;--good:#26703F;--warn:#9E4A1A;--bad:#A3342B;--soil:#8C6A4A;
  --grass:#A5C783;--soilc:#9C7550;--dim:0;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sh:140;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712;--surface:#17221A;--surface2:#1F2D23;--ink:#E6EDE3;--muted:#9AAC9F;--line:#2C3D31;
  --accent:#5FBF86;--accent-ink:#0B130E;--gold:#E3AE4A;--good:#6FCF97;--warn:#E8905F;--bad:#EE7C71;--soil:#A98763;
  --grass:#4A7240;--soilc:#6F513A;--dim:.42;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712;--surface:#17221A;--surface2:#1F2D23;--ink:#E6EDE3;--muted:#9AAC9F;--line:#2C3D31;
  --accent:#5FBF86;--accent-ink:#0B130E;--gold:#E3AE4A;--good:#6FCF97;--warn:#E8905F;--bad:#EE7C71;--soil:#A98763;
  --grass:#4A7240;--soilc:#6F513A;--dim:.42;color-scheme:dark}
:root[data-season="1"]{--sh:42}
:root[data-season="2"]{--sh:18}
:root[data-season="3"]{--sh:206}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:hsl(var(--sh) 36% 19%)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


/* clarity pass: compact header on phones, no duplicate shortcut tiles */
.bandtog{display:none}
@media(max-width:759px){
  .band{padding-block:12px}
  .season{font-size:clamp(26px,8vw,34px);margin-top:2px}
  .season .wk{font-size:12px}
  .eyebrow{font-size:11px}
  .stats{gap:10px 16px}
  .stat b{font-size:19px}
  .band-grid{gap:10px}
  .goal{margin-top:10px}
  .band-grid:not(.open) .strip,.band-grid:not(.open) .next,.band-grid:not(.open) .lvl,.band-grid:not(.open) .stat.sec{display:none}
  .bandtog{display:block;margin-top:10px;background:none;border:0;padding:6px 0;color:rgba(238,242,232,.85);font:500 12px var(--f-mono);letter-spacing:.04em;min-height:32px}
}
.steps{margin:14px 0 18px;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;counter-increment:s}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/24px var(--f-mono);text-align:center}


/* Sprout the guide */
#guide{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#guide>*{pointer-events:auto}
#guide .gm{flex:none;border:0;background:none;padding:0;animation:sproutbob 2.4s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#guide .gb{position:relative;max-width:min(78vw,380px);background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#guide .gb:before{content:"";position:absolute;left:-9px;bottom:20px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg)}
#guide .gb b{font:700 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#guide .gb p{margin:2px 0 4px;font-size:15px;line-height:1.35}
#guide .gx{background:none;border:0;padding:2px 0;color:var(--muted);font-size:12px;text-decoration:underline}
body.hasguide{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
body.hasguide .card.intro{display:none}
body.hasguide .toast{bottom:calc(272px + env(safe-area-inset-bottom,0px))}
@keyframes sproutbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glpulse{0%,100%{box-shadow:0 0 0 0 rgba(242,196,92,.9)}60%{box-shadow:0 0 0 10px rgba(242,196,92,0)}}
.gl{outline:3px solid #F2C45C!important;outline-offset:3px;animation:glpulse 1.4s ease-out infinite;position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){#guide .gm,.gl{animation:none}}


.gpath{display:flex;justify-content:space-between;gap:2px;margin:6px 0 4px}
.gpath span{flex:1;text-align:center;opacity:.5}
.gpath i{display:block;width:28px;height:28px;margin:0 auto;border-radius:50%;background:var(--surface2);border:2px solid var(--line);font:normal 14px/24px var(--f-body);color:var(--ink)}
.gpath em{display:block;font:500 9px var(--f-mono);letter-spacing:.03em;margin-top:2px;color:var(--muted);font-style:normal}
.gpath .done{opacity:1}.gpath .done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.gpath .now{opacity:1}.gpath .now i{border-color:#F2C45C;background:#FFF4D2;box-shadow:0 0 0 3px rgba(242,196,92,.45);transform:scale(1.15)}
.gpath .now em{color:var(--ink);font-weight:700}
.cpop{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));z-index:40;transform:translateX(-50%);padding:8px 16px;border-radius:999px;font:700 22px var(--f-mono);color:#fff;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:cpopf 1.7s ease-out forwards}
.cpop.up{background:#26703F}.cpop.down{background:#A3342B}
@keyframes cpopf{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
@media(prefers-reduced-motion:reduce){.cpop{animation:none;opacity:1}}


.wxline{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font:500 12px var(--f-mono);color:rgba(238,242,232,.9)}
.wxline span:first-child{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px}
.drop{animation:rainfall .8s linear infinite}
@keyframes rainfall{from{transform:translateY(-20px)}to{transform:translateY(240px)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 8px;font:500 12px var(--f-mono);color:var(--muted)}
.legend .rp{color:var(--gold);font-weight:700}
.plot[data-s=ready]{box-shadow:0 0 0 2px #F2C45C,0 0 14px rgba(242,196,92,.75);animation:ripeglow 1.6s ease-in-out infinite;border-radius:8px}
.plot[data-s=growing] .psv{animation:cropsway 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes ripeglow{0%,100%{box-shadow:0 0 0 2px #F2C45C,0 0 6px rgba(242,196,92,.4)}50%{box-shadow:0 0 0 2px #F2C45C,0 0 18px rgba(242,196,92,.95)}}
@keyframes cropsway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.field{position:relative}
.field.wx-rain:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;background:repeating-linear-gradient(105deg,rgba(143,196,232,.35) 0 1.5px,transparent 1.5px 14px);animation:rainbg .5s linear infinite}
.field.wx-dry:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;background:rgba(255,154,46,.12)}
@keyframes rainbg{to{background-position:-14px 28px}}
.ord{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px}
.ord.on{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.ordb{display:flex;gap:6px}
@media(prefers-reduced-motion:reduce){.drop,.plot[data-s=ready],.plot[data-s=growing] .psv,.field.wx-rain:after{animation:none}}

/* header band */
.band{background:hsl(var(--sh) 36% 19%);color:#EEF2E8;padding-block:18px 18px;transition:background .6s}
.band-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(238,242,232,.7)}
.season{font:700 clamp(36px,9vw,60px)/1 var(--f-display);letter-spacing:-.02em;margin-top:4px;text-wrap:balance}
.season .wk{font:500 13px var(--f-mono);letter-spacing:0;color:rgba(238,242,232,.72);margin-left:6px;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.sg span{display:block;margin-top:6px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(238,242,232,.7)}
.ticks{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:14px}
.ticks i{display:block;height:7px;background:rgba(238,242,232,.2);border-radius:1px}
.ticks i.past{background:rgba(238,242,232,.72)}
.ticks i.now{height:14px;background:#F2C45C}
.next{margin-top:10px;font:500 12px var(--f-mono);color:rgba(238,242,232,.82)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.stat small{display:block;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(238,242,232,.7)}
.stat b{display:block;font:500 clamp(19px,5vw,24px) var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat em{font-style:normal;font:400 12px var(--f-mono);color:rgba(238,242,232,.7)}
.goal{margin-top:16px;font:500 12px var(--f-mono);color:rgba(238,242,232,.82)}
.goal .gbar{height:6px;background:rgba(238,242,232,.2);border-radius:3px;margin-top:6px;overflow:hidden}
.goal .gbar i{display:block;height:100%;background:#F2C45C;border-radius:3px;transition:width .4s}
@media (min-width:760px){.band-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:end;gap:36px}}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:46px;display:inline-flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:2px;border-radius:9px;background:var(--gold);color:var(--bg);font:500 11px/18px var(--f-mono);text-align:center}

.view{padding-block:20px 28px}
.sec-head{margin-bottom:14px;display:grid;gap:4px}
.sec-head h2,.h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 17px/1.2 var(--f-display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card+.card{margin-top:12px}
.grid>.card+.card{margin-top:0}
.stack{display:grid;gap:12px}

/* buttons and tags */
.btn{min-height:40px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;line-height:1.2}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger.ask{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font:500 11px var(--f-mono);letter-spacing:.03em;color:var(--muted)}
.tag.on{border-color:var(--accent);color:var(--accent)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* illustrations */
.scene{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.cloud{animation:drift 80s linear infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(90px)}}
.flake{animation:fall 7s linear infinite}
@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(190px)}}
.spr{animation:spr 1.6s ease-in-out infinite}
@keyframes spr{50%{opacity:.25}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.ico{width:34px;height:34px;flex:none;display:block}
.vsvg{display:block;width:100%;height:auto}
.thumb{margin:-14px -14px 12px;border-radius:10px 10px 0 0;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:auto}

/* farms */
.intro{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;border-style:dashed}
.intro p{max-width:62ch;margin-top:2px}
.farm-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.farm-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fli{flex:0 0 auto;text-align:left;display:grid;gap:2px;padding:9px 12px;min-width:140px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fli.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fli span{font-size:12px;color:var(--muted)}
.fli .rdy{font-style:normal;color:var(--gold)}
@media (min-width:820px){.farm-layout{grid-template-columns:210px minmax(0,1fr)}.farm-list{flex-direction:column;overflow:visible}.fli{min-width:0}}
.farm-head{display:grid;gap:8px;margin-top:14px}
.farm-head h2{font:700 28px/1.1 var(--f-display);letter-spacing:-.015em}
.farm-meta{font:400 13px var(--f-mono);color:var(--muted)}
.label{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.chip{text-align:left;display:grid;grid-template-columns:34px 1fr;column-gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chip.sel{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.chip .ico{grid-row:span 3}
.chip b{font-weight:600}
.chip .cm{font:400 12px var(--f-mono);color:var(--muted)}
.cs{font:500 11px var(--f-mono);letter-spacing:.03em}
.cs.ok{color:var(--good)}.cs.warn{color:var(--warn)}.cs.off{color:var(--muted)}

/* hand work and jobs */
.hand{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:10px}
.hand span{font-size:13px;color:var(--muted)}
.hand .bar{grid-column:1/-1}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.job{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.job.has{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.job .jv{background:var(--surface2);border-radius:8px;padding:6px 4px}
.job.idle .jv svg{opacity:.45;filter:grayscale(.6)}
.job .jt{display:grid;gap:1px;min-width:0}
.job .jt b{font:700 17px/1.2 var(--f-display)}
.job .jm{font:500 12px var(--f-mono);color:var(--accent)}
.job.idle .jm{color:var(--warn)}
.job .jt .muted{font-size:13px}
.job .ja{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* plots drawn as small parcels */
.field{position:relative;border-radius:8px;overflow:hidden}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.plot{position:relative;aspect-ratio:1;min-height:66px;padding:0;border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:6px;background:var(--grass);overflow:hidden;display:block}
.plot[data-s="1"],.plot[data-s="growing"],.plot[data-s="ready"]{background:var(--soilc)}
.plot .psv{position:absolute;inset:0;width:100%;height:100%;display:block}
.plot[data-s="ready"] .crop-g{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.plot .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}
.plot .pb i{display:block;height:100%;background:#F2C45C}
.plot .pl{position:absolute;left:3px;bottom:6px;padding:0 5px;border-radius:4px;background:rgba(15,23,18,.72);color:#F1F5EC;font:500 10.5px/16px var(--f-mono)}
.plot[data-s="ready"]{border:2px solid var(--gold);animation:pulse 2.2s ease-in-out infinite}

.store{display:grid;gap:8px;margin-bottom:12px}

/* bank */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}

.pos{color:var(--good)}.neg{color:var(--bad)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}

.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}

/* dock + toast */

.dock-info{min-width:0}

.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
const KEY='tilth-save-v3';
const SEASON_NAMES=['Spring','Summer','Autumn','Winter'];
const GOALS=[40000,100000,250000,500000,1000000];
const HAND=6,MGR_HAND=8;
const CROPS={
  wheat:{name:'Wheat',h:50,grow:10,seed:50,yield:30,price:13,seasons:[0,2],hardy:true,spoil:0,vol:.05,seasonal:[1,1.05,.85,1.1]},
  potato:{name:'Potato',h:30,grow:8,seed:60,yield:32,price:13,seasons:[0,2],hardy:false,spoil:.01,vol:.06,seasonal:[1.05,1,.85,1.15]},
  corn:{name:'Corn',h:78,grow:12,seed:70,yield:40,price:13.5,seasons:[0,1],hardy:false,spoil:.005,vol:.06,seasonal:[1.1,.95,.8,1.1]},
  carrot:{name:'Carrot',h:18,grow:6,seed:45,yield:26,price:11,seasons:[0,2],hardy:true,spoil:.03,vol:.07,seasonal:[1,1,.9,1.15]},
  tomato:{name:'Tomato',h:355,grow:8,seed:110,yield:22,price:26,seasons:[0,1],hardy:false,spoil:.08,vol:.12,seasonal:[1.05,.85,1,1.4]},
  strawberry:{name:'Strawberry',h:320,grow:7,seed:120,yield:14,price:42,seasons:[0,1],hardy:false,spoil:.12,vol:.14,seasonal:[.9,.85,1.1,1.5]},
  pumpkin:{name:'Pumpkin',h:36,grow:9,seed:60,yield:18,price:32,seasons:[1,2],hardy:false,spoil:.01,vol:.09,seasonal:[1.1,1,.8,1.3]},
  garlic:{name:'Garlic',h:265,grow:14,seed:90,yield:16,price:45,seasons:[2],hardy:true,spoil:.005,vol:.08,seasonal:[1.05,1,.9,1.1]}
};
const CROP_KEYS=Object.keys(CROPS);
const VEH={
  tractor:{name:'Tractor',price:9000,desc:'Ploughs every wild plot on its farm in one pass. Crops there also grow 15% faster.'},
  seeder:{name:'Seed drill',price:4500,desc:'Sows every ploughed plot in one pass and cuts seed cost by 25%.'},
  harvester:{name:'Combine harvester',price:12000,desc:'Harvests every ready plot in one pass and adds 18% yield.'},
  sprayer:{name:'Crop sprayer',price:4500,desc:'Sprays the whole farm. Sprayed crops are safe from pests for 6 weeks and yield 6% more.'},
  truck:{name:'Delivery truck',price:8000,desc:'Hauls your crops to town. While deployed, every crop you sell brings 10% more.'},
  trailer:{name:'Grain trailer',price:3500,desc:'Adds 250 units of storage while deployed.'}
};
const VEH_KEYS=Object.keys(VEH);
const JOBS={
  plough:{name:'Plough',veh:'tractor',fuel:4,color:'#6B4527'},
  sow:{name:'Sow',veh:'seeder',fuel:1,color:'#5FAE4A'},
  spray:{name:'Spray',veh:'sprayer',fuel:2,color:'#3D95CF'},
  harvest:{name:'Harvest',veh:'harvester',fuel:3,color:'#E3B33C'}
};
const JOB_KEYS=['plough','sow','spray','harvest'];
const UPG={
  greenhouse:{name:'Greenhouse',cost:5000,val:3000,desc:'Frost-proof, and lets you sow any crop in any season. Winter seed costs 10% more.'},
  irrigation:{name:'Irrigation',cost:3000,val:1800,desc:'+8% yield, and dry spells no longer slow this farm.'},
  silo:{name:'Grain silo',cost:3500,val:2100,desc:'Adds 300 units of storage for the whole business.'},
  shed:{name:'Machine shed',cost:4000,val:2400,desc:'Shelters machines working here. They age half as fast (keeping their resale value) and upkeep is 30% lower.'},
  scarecrow:{name:'Scarecrow',cost:800,val:400,desc:'Scares off pests. Pest attacks here destroy about 70% fewer plots.'},
  fert:{name:'Fertiliser spreader',cost:2500,val:1500,desc:'Crops here grow 10% faster and yield 4% more.'}
};
const FARM_NAMES=['Willow Bend','Red Clay Flats','North Ridge','Millbrook','Heron Meadow','Stonegate','Larkfield','Copper Hollow','Ash Terrace','Dunmore','Bramble Row','Quarry Lea','Fenwick Reach','Saltmarsh Acres','Highfold','Barley Cross'];

const LV=[0,120,350,750,1400,2400,3800,6000,9500,15000];
const TITLES=['Greenhorn','Tiller','Sower','Grower','Yeoman','Steward','Landholder','Agronomist','Estate Owner','Tycoon'];
const CROP_LV={wheat:1,potato:1,carrot:1,corn:2,pumpkin:3,tomato:3,strawberry:4,garlic:5};
const VEH_LV={tractor:1,trailer:2,seeder:2,harvester:3,sprayer:3,truck:4};
const WK=[{role:'Farmhand',hand:2,wage:35,fee:150,lv:1},{role:'Skilled hand',hand:3,wage:55,fee:300,lv:3},{role:'Expert hand',hand:5,wage:85,fee:600,lv:5}];
const WNAMES=['Ana','Ben','Chidi','Dara','Eli','Farah','Gus','Hana','Ivo','Jun','Kofi','Lena','Mo','Nia','Omar','Pia'];
const SKINS=['#F1C7A0','#D9A06F','#B87A4B','#8A5632','#5E3A22'],SHIRTS=['#3F7CAC','#C9402E','#4E9F42','#E0A526','#7A4FA0','#2E8B8B'],HATS=['#E3C071','#C9A24B','#8C6A3B','#D9B45A'];
let S=null;
const UI={confirm:null,auto:false,anim:null,gi:0,lastCash:null};
let autoTimer=null,confirmTimer=null,toastTimer=null,animTimer=null;

const $=s=>document.querySelector(s);
const rand=()=>Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(rand()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−$':'$')+Math.round(Math.abs(n)).toLocaleString('en-US');
const money2=n=>'$'+n.toFixed(2);
const abbr=n=>{const a=Math.abs(n),s=n<0?'−':'';return a>=1e6?s+'$'+(a/1e6).toFixed(1)+'M':a>=1000?s+'$'+Math.round(a/1000)+'k':s+'$'+Math.round(a);};
const ck=(a,id,i)=>a+':'+(id===undefined?'':id)+':'+(i===undefined?'':i);
const colr=k=>'hsl('+CROPS[k].h+' 55% 40%)';
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- calendar ---------- */
const season=()=>Math.floor((S.week%48)/12);
const wkIn=()=>(S.week%12)+1;
const yearNo=()=>Math.floor(S.week/48)+1;
const weeksToWinter=()=>{const r=S.week%48;return r>=36?0:36-r;};
const weeksToSpring=()=>48-(S.week%48);

/* ---------- state ---------- */
function base(){
  return {v:3,xp:0,week:0,cash:12000,loan:0,goalIdx:0,over:false,landIndex:1,nextId:1,
    farms:[],stock:{},market:{},vehicles:[],listings:[],used:[],log:[],ledger:[],nwHist:[],
    cur:{income:0,expense:0},ui:{tab:'farms',farm:null,crop:'potato',plot:null,speed:1}};
}
/* plot states: s0 wild ground, s1 ploughed, s2 crop in the ground */
function makeFarm(name,n,soil,o){
  o=o||{};
  return {id:S.nextId++,name:name,soil:soil,plots:Array.from({length:n},()=>({s:0})),greenhouse:!!o.greenhouse,irrigation:!!o.irrigation,silo:!!o.silo,manager:false,workers:[],hand:HAND,sprayUntil:-1};
}
function newGame(){
  S=base();
  CROP_KEYS.forEach(k=>{S.stock[k]=0;S.market[k]={trend:0,impact:1,boom:0,hist:[]};});
  for(let i=0;i<14;i++){CROP_KEYS.forEach(k=>{const m=S.market[k],c=CROPS[k];m.trend=clamp(m.trend*.88+(rand()-.5)*2*c.vol,-.35,.4);m.hist.push(price(k));});}
  S.listings.push(genListing(6,true));
  S.listings.push(genListing(8,true));
  while(S.listings.length<4)S.listings.push(genListing());
  while(S.used.length<3){const u=genUsed();if(!u)break;S.used.push(u);}
  S.nwHist.push(netWorth());
  log('Welcome to Tilth. It is spring and you have $12,000 but no land yet.');
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===3&&Array.isArray(o.farms)){S=o;S.xp=S.xp||0;return true;}}}catch(e){}
  return false;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function log(text,kind){S.log.unshift({w:S.week,text:text,kind:kind||'info'});if(S.log.length>80)S.log.length=80;}

/* ---------- economy helpers ---------- */
const farmHas=(f,t)=>S.vehicles.some(v=>v.type===t&&v.farm===f.id);
const deployed=t=>S.vehicles.some(v=>v.type===t&&v.farm&&S.farms.some(f=>f.id===v.farm));
function price(k){const c=CROPS[k],m=S.market[k];return c.price*c.seasonal[season()]*Math.exp(m.trend)*m.impact*(m.boom>0?1.25:1);}
const landValue=(n,soil)=>Math.round(n*1100*soil*S.landIndex);
function farmValue(f){let v=landValue(f.plots.length,f.soil);Object.keys(UPG).forEach(k=>{if(f[k])v+=UPG[k].val;});return v;}
const farmSell=f=>Math.round(farmValue(f)*.92);
const depVal=(t,age)=>Math.round(VEH[t].price*Math.max(.4,1-.003*age));
const vehSell=v=>Math.round(depVal(v.type,v.age)*.9);
const mgrWage=f=>40+4*f.plots.length;
const capacity=()=>S.farms.reduce((a,f)=>a+150+10*f.plots.length+(f.silo?300:0),0)+250*S.vehicles.filter(v=>v.type==='trailer'&&v.farm&&S.farms.some(f=>f.id===v.farm)).length;
const stored=()=>CROP_KEYS.reduce((a,k)=>a+S.stock[k],0);
const stockValue=()=>CROP_KEYS.reduce((a,k)=>a+S.stock[k]*price(k),0);
const assetValue=()=>S.farms.reduce((a,f)=>a+farmValue(f),0)+S.vehicles.reduce((a,v)=>a+depVal(v.type,v.age),0);
const netWorth=()=>S.cash+stockValue()+assetValue()-S.loan;
const creditLimit=()=>Math.round((10000+.5*assetValue())/500)*500;
function growSpeed(f,s){if(s===undefined)s=season();return(farmHas(f,'tractor')?1.15:1)*((s===3&&!f.greenhouse)?.5:1)*(f.fert?1.1:1);}
const seedCost=(k,f)=>Math.round(CROPS[k].seed*(farmHas(f,'seeder')?.75:1)*((f.greenhouse&&season()===3)?1.1:1));
const sprayed=f=>f.sprayUntil>S.week;
function yieldFor(f,k){
  const y=CROPS[k].yield*f.soil*(farmHas(f,'harvester')?1.18:1)*(sprayed(f)?1.06:1)*(f.irrigation?1.08:1)*(f.fert?1.04:1)*(.95+rand()*.1);
  return Math.max(1,Math.round(y));
}
function farmStats(f){
  const r={wild:0,plowed:0,growing:0,ready:0,empty:0};
  f.plots.forEach(p=>{if(p.s===0)r.wild++;else if(p.s===1)r.plowed++;else if(p.p>=p.need)r.ready++;else r.growing++;});
  r.empty=r.wild+r.plowed;return r;
}
function weeklyCosts(){
  let land=0,wages=0,mach=0;
  S.farms.forEach(f=>{land+=25+2*f.plots.length+(f.greenhouse?10:0);if(f.manager)wages+=mgrWage(f);wk(f).forEach(w=>{wages+=WK[w.t].wage;});});
  S.vehicles.forEach(v=>{const fm=v.farm&&S.farms.find(x=>x.id===v.farm);mach+=VEH[v.type].price*.0025*((fm&&fm.shed)?.7:1);});
  mach=Math.round(mach);
  const interest=Math.round(S.loan*.003),over=S.cash<0?Math.round(-S.cash*.01):0;
  return{land:land,wages:wages,mach:mach,interest:interest,over:over,total:land+wages+mach+interest+over};
}

/* ---------- listings ---------- */
function genListing(force,plain){
  const owned=new Set(S.farms.map(f=>f.name)),taken=new Set(S.listings.map(l=>l.name));
  const pool=FARM_NAMES.filter(n=>!owned.has(n)&&!taken.has(n));
  const name=pool.length?pick(pool):'Parcel '+S.nextId;
  const plots=force||pick([6,8,8,10,12,12,16,20,24]);
  const soil=Math.round((.8+rand()*.55)*100)/100;
  const gh=!plain&&rand()<.25,irr=!plain&&rand()<.25,silo=!plain&&rand()<.2;
  const raw=landValue(plots,soil)*(.92+rand()*.2)+(gh?UPG.greenhouse.cost:0)+(irr?UPG.irrigation.cost:0)+(silo?UPG.silo.cost:0);
  return{id:S.nextId++,name:name,plots:plots,soil:soil,greenhouse:gh,irrigation:irr,silo:silo,price:Math.round(raw/50)*50};
}
function genUsed(){
  const taken=new Set(S.used.map(u=>u.type));
  const pool=VEH_KEYS.filter(t=>!taken.has(t));
  if(!pool.length)return null;
  const type=pick(pool),age=Math.round(15+rand()*85);
  return{id:S.nextId++,type:type,age:age,price:Math.round(depVal(type,age)*(.95+rand()*.15)/10)*10};
}

/* ---------- field work ---------- */
function plantStatus(f,k){
  const c=CROPS[k],s=season(),inSeason=c.seasons.includes(s);
  if(lvl()<CROP_LV[k])return{ok:false,label:'Unlocks Lv '+CROP_LV[k],cls:'off'};
  if(!f.greenhouse&&!inSeason)return{ok:false,label:'Out of season',cls:'off'};
  if(f.greenhouse&&!inSeason)return{ok:true,label:'Under glass',cls:'ok'};
  if(!f.greenhouse&&!c.hardy){const steps=Math.ceil(c.grow/growSpeed(f));if(steps>weeksToWinter())return{ok:true,label:'Frost risk',cls:'warn'};}
  return{ok:true,label:'Sow now',cls:'ok'};
}
function plantPlot(f,i,k){
  const pl=f.plots[i];
  if(!pl||pl.s!==1)return'Plough this plot first.';
  if(lvl()<CROP_LV[k])return CROPS[k].name+' unlocks at level '+CROP_LV[k]+'.';
  const st=plantStatus(f,k);
  if(!st.ok)return CROPS[k].name+' cannot be sown in '+SEASON_NAMES[season()].toLowerCase()+' without a greenhouse.';
  const cost=seedCost(k,f);
  if(S.cash<cost)return'Not enough cash for seed.';
  S.cash-=cost;S.cur.expense+=cost;
  f.plots[i]={s:2,crop:k,p:0,need:CROPS[k].grow};gain(3);
  return null;
}
function addStock(k,n){
  const room=Math.max(0,capacity()-stored()),keep=Math.min(room,n),over=n-keep;
  S.stock[k]+=keep;
  let rev=0;
  if(over>0){rev=Math.round(over*price(k)*.7);S.cash+=rev;S.cur.income+=rev;}
  return{keep:keep,over:over,rev:rev};
}
function harvestPlot(f,i){
  const pl=f.plots[i];
  if(!pl||pl.s!==2||pl.p<pl.need)return null;
  const n=yieldFor(f,pl.crop);
  f.plots[i]={s:0};
  gain(n*.5);const r=addStock(pl.crop,n);

}
function jobIdx(f,job){
  const r=[];
  f.plots.forEach((p,i)=>{
    if(job==='plough'&&p.s===0)r.push(i);
    else if(job==='sow'&&p.s===1)r.push(i);
    else if(job==='spray'&&p.s===2&&p.p<p.need)r.push(i);
    else if(job==='harvest'&&p.s===2&&p.p>=p.need)r.push(i);
  });
  return r;
}
/* A job runs on every eligible plot at once when the matching machine works on the farm. Otherwise it uses hand work from budget b. */
function doJob(f,job,b,o){
  o=o||{};
  const J=JOBS[job],idx=jobIdx(f,job),mach=farmHas(f,J.veh);
  const res={n:0,mach:mach,fuel:0,err:null,got:{},over:0,spent:0};
  if(!idx.length){res.err='Nothing to '+J.name.toLowerCase()+' on this farm.';return res;}
  if(job==='spray'){
    if(!mach){res.err='Spraying needs a crop sprayer working on this farm.';return res;}
    const fuel=J.fuel*idx.length;S.cash-=fuel;S.cur.expense+=fuel;f.sprayUntil=S.week+6;res.n=idx.length;res.fuel=fuel;return res;
  }
  const left=mach?idx.length:b.left;
  if(left<=0){res.err='No hand work left on this farm this week. Deploy a '+VEH[J.veh].name.toLowerCase()+' or press Next week.';return res;}
  for(let q=0;q<idx.length;q++){
    if(res.n>=left)break;
    const i=idx[q];
    if(job==='plough')f.plots[i]={s:1};
    else if(job==='sow'){const e=plantPlot(f,i,o.crop);if(e){res.err=e;break;}res.spent+=seedCost(o.crop,f);}
    else if(job==='harvest'){const r=harvestPlot(f,i);if(r){res.got[r.crop]=(res.got[r.crop]||0)+r.n;res.over+=r.over;}}
    res.n++;
  }
  if(!mach)b.left-=res.n;
  else if(res.n){res.fuel=J.fuel*res.n;S.cash-=res.fuel;S.cur.expense+=res.fuel;}
  return res;
}
function runJob(f,job){
  const b={left:f.hand};
  const r=doJob(f,job,b,{crop:S.ui.crop});
  f.hand=b.left;
  return r;
}
function bestCrop(f,cash){
  const s=season();let best=null,bs=-1e9;
  CROP_KEYS.forEach(k=>{
    const c=CROPS[k];
    if(lvl()<CROP_LV[k]||!(c.seasons.includes(s)||f.greenhouse))return;
    const cost=seedCost(k,f);
    if(cost>cash)return;
    const steps=Math.ceil(c.grow/growSpeed(f,s));
    if(!f.greenhouse&&!c.hardy&&steps>weeksToWinter())return;
    const score=(c.yield*f.soil*price(k)*.85-cost)/steps;
    if(score>bs){bs=score;best=k;}
  });
  return best;
}
function runManagers(){
  const t={harvest:0,plough:0,sow:0,spray:0};
  S.farms.forEach(f=>{
    if(!f.manager&&!f.auto)return;
    const b={left:f.manager?MGR_HAND:handMax(f)};
    t.harvest+=doJob(f,'harvest',b).n;
    t.plough+=doJob(f,'plough',b).n;
    const k=bestCrop(f,S.cash);
    if(k)t.sow+=doJob(f,'sow',b,{crop:k}).n;
    if(farmHas(f,'sprayer')&&!sprayed(f)&&jobIdx(f,'spray').length)t.spray+=doJob(f,'spray',b).n;
  });
  if(t.harvest||t.plough||t.sow||t.spray)log((S.farms.some(x=>x.manager)?'Managers and autopilot':'Autopilot')+' harvested '+t.harvest+', ploughed '+t.plough+', sowed '+t.sow+(t.spray?' and sprayed '+t.spray:'')+' plots.');
}
function sell(k,qty){
  qty=Math.min(Math.floor(qty),S.stock[k]);
  if(qty<=0)return 0;
  const p=price(k)*(deployed('truck')?1.1:1),avg=1-Math.min(.4,qty*.0002);
  const rev=Math.round(qty*p*avg);
  S.cash+=rev;S.cur.income+=rev;S.stock[k]-=qty;gain(rev/40);
  S.market[k].impact=Math.max(.55,S.market[k].impact*(1-Math.min(.4,qty*.0004)));
  return rev;
}
function spoil(){
  CROP_KEYS.forEach(k=>{const r=CROPS[k].spoil;if(r&&S.stock[k]>0)S.stock[k]-=Math.min(S.stock[k],Math.round(S.stock[k]*r));});
}
function stepPrices(){
  CROP_KEYS.forEach(k=>{
    const c=CROPS[k],m=S.market[k];
    m.trend=clamp(m.trend*.88+(rand()-.5)*2*c.vol,-.35,.4);
    m.impact+=(1-m.impact)*.15;
    if(m.boom>0)m.boom--;
    m.hist.push(price(k));
    if(m.hist.length>26)m.hist.shift();
  });
}
function frost(){
  let lost=0;
  S.farms.forEach(f=>{
    if(f.greenhouse)return;
    f.plots.forEach((pl,i)=>{if(pl.s===2&&!CROPS[pl.crop].hardy&&pl.p<pl.need){f.plots[i]={s:1};lost++;}});
  });
  if(lost)log('Frost killed '+lost+' unfinished plot'+(lost===1?'':'s')+'.','bad');
  else log('Winter has arrived. No crops were lost.');
}
function rollEvent(){
  if(rand()>.14)return;
  const s=season();
  const table=[['drought',0],['pests',2],['boom',2],['glut',1],['grant',1],['storm',1],['rain',0]];
  let tot=0;table.forEach(t=>tot+=t[1]);
  let r=rand()*tot,ev='grant';
  for(let i=0;i<table.length;i++){r-=table[i][1];if(r<=0){ev=table[i][0];break;}}
  if(ev==='drought'){
    let n=0;
    S.farms.forEach(f=>{if(f.irrigation)return;f.plots.forEach(pl=>{if(pl.s===2&&pl.p<pl.need){pl.p=Math.max(0,pl.p-1);n++;}});});
    log(n?'A dry spell set back '+n+' growing plot'+(n===1?'':'s')+' by a week.':'A dry spell passed. Your fields were not affected.',n?'event':'info');
  }else if(ev==='pests'){
    const cands=S.farms.filter(f=>farmStats(f).growing>0);
    if(!cands.length)return;
    const f=pick(cands);
    if(sprayed(f)){log('Pests hit '+f.name+', but the sprayed crops held.','good');return;}
    const idx=[];f.plots.forEach((pl,i)=>{if(pl.s===2&&pl.p<pl.need)idx.push(i);});
    const lose=Math.max(f.scarecrow?0:1,Math.round(idx.length*(.2+rand()*.15)*(f.scarecrow?.3:1)));
    for(let n=0;n<lose;n++){const j=Math.floor(rand()*idx.length);f.plots[idx[j]]={s:1};idx.splice(j,1);}
    if(!lose)log('Pests visited '+f.name+' but the scarecrow chased them off.','good');else log('Pests destroyed '+lose+' plot'+(lose===1?'':'s')+' at '+f.name+'. A scarecrow or crop sprayer prevents this.','bad');
  }else if(ev==='boom'){
    const k=pick(CROP_KEYS);S.market[k].boom=4;
    log('Demand surge: '+CROPS[k].name+' prices are up 25% for 4 weeks.','good');
  }else if(ev==='glut'){
    const k=pick(CROP_KEYS);S.market[k].impact=Math.max(.55,S.market[k].impact*.78);
    log('Imports flood the '+CROPS[k].name.toLowerCase()+' market. Prices dip.','event');
  }else if(ev==='grant'){
    S.cash+=600;S.cur.income+=600;log('You received a $600 farm grant.','good');
  }else if(ev==='storm'){
    const c=Math.round(300+rand()*300);S.cash-=c;S.cur.expense+=c;log('A storm damaged fences and sheds. Repairs cost '+money(c)+'.','bad');
  }else if(ev==='rain'){
    let n=0;S.farms.forEach(f=>f.plots.forEach(pl=>{if(pl.s===2&&pl.p<pl.need){pl.p=Math.min(pl.need,pl.p+.5);n++;}}));
    if(n)log('Good rain helped '+n+' growing plot'+(n===1?'':'s')+'.','good');
  }
}
const WX={sun:['☀️','Sunny','Normal growth'],cloud:['☁️','Cloudy','Normal growth'],rain:['🌧️','Rain','Crops grow faster'],dry:['🔥','Heatwave','Slows crops without irrigation']};
function genWx(){
  const s=season(),T=[[['sun',40],['rain',40],['cloud',15],['dry',5]],[['sun',45],['dry',25],['rain',18],['cloud',12]],[['rain',38],['cloud',27],['sun',30],['dry',5]],[['cloud',45],['sun',30],['rain',25]]][s];
  let tot=0;T.forEach(t=>tot+=t[1]);let r=rand()*tot;
  for(let i=0;i<T.length;i++){r-=T[i][1];if(r<=0)return T[i][0];}
  return'sun';
}
function ensureW(){if(!S.wx)S.wx={now:'sun',next:genWx()};}
function advanceWx(){

  else if(w==='dry'){S.farms.forEach(f=>{if(f.irrigation)return;f.plots.forEach(pl=>{if(pl.s===2&&pl.p<pl.need){pl.p=Math.max(0,pl.p-.5);n++;}});});if(n)log('A heatwave slowed '+n+' growing plot'+(n===1?'':'s')+'. Irrigation protects against this.','event');}
}
function wxLine(){

function ensureC(){S.contracts=S.contracts||[];S.cOffers=S.cOffers||[];S.cDone=S.cDone||0;while(S.cOffers.length<3)S.cOffers.push(genOffer());}
function genOffer(){

function nextWeek(){
  if(S.over)return false;
  const prev=season();
  S.week++;
  const now=season();
  S.vehicles.forEach(v=>{const fm=v.farm&&S.farms.find(x=>x.id===v.farm);v.age+=(fm&&fm.shed)?.5:1;});
  S.farms.forEach(f=>{f.hand=handMax(f);const sp=growSpeed(f,prev);f.plots.forEach(pl=>{if(pl.s===2&&pl.p<pl.need)pl.p=Math.min(pl.need,pl.p+sp);});});

    for(let n=0;n<2;n++)if(S.listings.length>2)S.listings.splice(Math.floor(rand()*S.listings.length),1);
    while(S.listings.length<4)S.listings.push(genListing());

  }
  if(S.week%6===0){
    if(S.used.length)S.used.splice(Math.floor(rand()*S.used.length),1);
    while(S.used.length<3){const u=genUsed();if(!u)break;S.used.push(u);}
  }
  S.ledger.unshift({w:S.week,income:S.cur.income,expense:S.cur.expense});
  if(S.ledger.length>12)S.ledger.length=12;
  S.cur={income:0,expense:0};
  const nw=netWorth();
  S.nwHist.push(nw);

  if(S.goalIdx<GOALS.length&&nw>=GOALS[S.goalIdx]){log('Goal reached: net worth passed '+money(GOALS[S.goalIdx])+'.','good');S.goalIdx++;}

}

  return '<div class="visual-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg><span>YOUR FARM, YOUR STRATEGY · Choose a shortcut to explore</span></div><section class="photo-showcase" aria-label="Farm shortcuts">'+items.map((it,i)=>'<article class="photo-tile"><img src="'+it.img+'" alt="'+it.alt+'" loading="'+(i?'lazy':'eager')+'" onerror="this.style.opacity=0"><div class="photo-copy"><small>'+it.eyebrow+'</small><b>'+it.title+'</b><button type="button" data-a="tab" data-id="'+it.dest+'">Explore '+it.sub.toLowerCase()+' ↗</button></div></article>').join('')+'</section>';
}

function cashPop(){
  const c=Math.round(S.cash),l=UI.lastCash;UI.lastCash=c;
  if(l===null||c===l||S.free)return;
  const d=c-l,e=document.createElement('div');
  e.className='cpop '+(d>0?'up':'down');e.textContent=(d>0?'+':'−')+money(Math.abs(d));
  document.body.appendChild(e);setTimeout(()=>e.remove(),1800);
}
/* ---------- Sprout the guide ---------- */
const SPROUT='<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><ellipse cx="32" cy="60" rx="16" ry="3" fill="rgba(0,0,0,.18)"/><path d="M32 12C30 5 24 3 18 5c1 7 7 10 14 7z" fill="#4E9A3F"/><path d="M32 12c2-7 8-9 14-7-1 7-7 10-14 7z" fill="#6DBB52"/><rect x="31" y="10" width="2.5" height="9" fill="#3C7A31"/><circle cx="32" cy="38" r="21" fill="#8FD16B" stroke="#3C7A31" stroke-width="2.5"/><ellipse cx="24" cy="36" rx="3.4" ry="4.4" fill="#16231A"/><ellipse cx="40" cy="36" rx="3.4" ry="4.4" fill="#16231A"/><circle cx="25.2" cy="34.4" r="1.2" fill="#fff"/><circle cx="41.2" cy="34.4" r="1.2" fill="#fff"/><path d="M26 44q6 6 12 0" stroke="#16231A" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="19" cy="43" r="3" fill="#F4A58A" opacity=".7"/><circle cx="45" cy="43" r="3" fill="#F4A58A" opacity=".7"/></svg>';
function guideStep(){
  if(UI.auto)return{k:'auto',msg:'Time is running by itself because Auto is on. Tap Pause to slow down and take your time.',sel:'#dock [data-a=auto]'};
  if(!S.farms.length){
    if(S.ui.tab!=='land')return{k:'g1',msg:'Hi, I am Sprout! Let us start a farm. Tap Land market.',sel:'[data-a=tab][data-id=land]'};
    return{k:'g2',msg:'Pick a farm and tap Buy farm. A small, cheap one is fine to learn on.',sel:'[data-a=buyFarm]:not([disabled])'};
  }
  const f=S.farms.find(x=>x.id===S.ui.farm)||S.farms[0];
  if(S.ui.tab!=='farms'){
    if(S.ui.tab==='crops'&&stored()>0)return{k:'sell',msg:'Your harvest is in storage. Tap a Sell button to turn crops into cash.',sel:'[data-a=sellCrop]:not([disabled])'};
    return{k:'back',msg:'Tap Farms to go back to your land and keep working.',sel:'[data-a=tab][data-id=farms]'};
  }
  const st=farmStats(f);
  const qj=st.ready?'harvest':st.wild?'plough':st.plowed?'sow':null;
  if(qj){
    const J=JOBS[qj],n=jobIdx(f,qj).length,m=farmHas(f,J.veh);
    if(!m&&f.hand<=0&&n>0)return{k:'hand',msg:'You are out of hand work for this week. Tap Next week to get it back. Then we will '+J.name.toLowerCase()+'.',sel:'#dock [data-a=next]'};
    if(qj==='plough')return{k:'plough',msg:'Plough turns wild ground into soil so seeds can grow. Tap the glowing Plough button. By hand you can do '+plural(f.hand,'plot')+' this week.',sel:'.jobs [data-job=plough]:not([disabled])'};
    if(qj==='sow'){
      if(S.cash<seedCost(S.ui.crop,f))return{k:'cheap',msg:'Not enough cash for that seed. Pick a cheaper crop from the list.',sel:'.chip'};
      return{k:'sow',msg:'Soil is ready! Choose a crop in the list, then tap the glowing Sow button to plant it.',sel:'.jobs [data-job=sow]:not([disabled])'};
    }
    return{k:'harvest',msg:'Your crops are ripe! Tap Harvest to collect them.',sel:'.jobs [data-job=harvest]:not([disabled])'};
  }
  if(stored()>0&&!st.growing)return{k:'sell2',msg:'You have crops in storage. Open the Crops tab to sell them for cash.',sel:'[data-a=tab][data-id=crops]'};
  return{k:'wait',msg:'Plants need time to grow. Tap Next week. Each plot shows how many weeks are left.'+wxTip(),sel:'#dock [data-a=next]'};
}
function renderGuide(){
  let g=document.getElementById('guide');
  if(!g){g=document.createElement('div');g.id='guide';document.body.appendChild(g);}
  document.querySelectorAll('.gl').forEach(e=>e.classList.remove('gl'));
  if(S.over){g.innerHTML='';document.body.classList.remove('hasguide');return;}
  const st=guideStep();
  document.body.classList.toggle('hasguide',!UI.guideOff);
  g.className=UI.guideOff?'off':'';
  const GI={g1:0,g2:0,plough:1,sow:2,cheap:2,wait:3,auto:3,harvest:4,sell:5,sell2:5};
  if(GI[st.k]!==undefined)UI.gi=GI[st.k];
  const PATH=[['🏞️','Buy'],['🚜','Plough'],['🌱','Sow'],['⏳','Grow'],['🌾','Harvest'],['💰','Sell']];
  const path='<div class="gpath" aria-hidden="true">'+PATH.map((x,i)=>'<span class="'+(i===UI.gi?'now':i<UI.gi?'done':'')+'"><i>'+(i<UI.gi?'✓':x[0])+'</i><em>'+x[1]+'</em></span>').join('')+'</div>';
  g.innerHTML='<button type="button" class="gm" data-a="guide" aria-label="'+(UI.guideOff?'Show Sprout the guide':'Hide Sprout the guide')+'">'+SPROUT+'</button>'+
    (UI.guideOff?'':'<div class="gb" role="status"><b>Sprout</b>'+path+'<p>'+st.msg+'</p><button type="button" class="gx" data-a="guide">Hide tips</button></div>');
  if(UI.guideOff)return;
  const el=document.querySelector(st.sel);
  if(el){
    el.classList.add('gl');
    if(UI.guideKey!==st.k){UI.guideKey=st.k;if(st.k!=='wait'&&st.k!=='hand'&&st.k!=='auto'){setTimeout(()=>{const t=document.querySelector('.gl');if(t){const r=t.getBoundingClientRect();if(r.top>innerHeight*.55||r.top<80)window.scrollBy(0,r.top-innerHeight*.3);}},60);}}
  }else UI.guideKey=st.k;
}

function render(){
  ensureW();S.orders=S.orders||{};
  if(S.free&&S.cash<5e8)S.cash=1e9;
  const fk=keyOf(document.activeElement);
  renderBand();renderTabs();
  const R={contracts:renderContracts,farms:renderFarms,land:renderLand,crops:renderCrops,machines:renderMachines,bank:renderBank};
  $('#view').innerHTML=S.over?renderOver():(R[S.ui.tab]||renderFarms)();
  renderDock();renderGuide();cashPop();
  if(fk){
    let found=null;
    document.querySelectorAll('[data-a]').forEach(e=>{if(!found&&!e.disabled&&keyOf(e)===fk)found=e;});
    if(found&&found.focus)found.focus({preventScroll:true});
  }
}

/* ---------- actions ---------- */
const CONFIRM=new Set(['sellFarm','sellVeh','clearPlot','newGame']);
function afterJob(f,job,r){
  if(!r.n){toast(r.err||'Nothing to do.','warn');return;}
  const J=JOBS[job],V=VEH[J.veh];
  let m;
  if(job==='harvest')m='Harvested '+plural(r.n,'plot')+': '+Object.keys(r.got).map(k=>r.got[k]+' '+CROPS[k].name.toLowerCase()).join(', ');
  else if(job==='plough')m='Ploughed '+plural(r.n,'plot');
  else if(job==='sow')m='Sowed '+plural(r.n,'plot')+' of '+CROPS[S.ui.crop].name.toLowerCase()+' for '+money(r.spent);
  else m='Sprayed '+plural(r.n,'growing plot')+'. Safe from pests for 6 weeks';
  if(r.mach){m=V.name+': '+m+' (fuel '+money(r.fuel)+')';setAnim(J.veh,job,f.id);}
  else m+=' by hand. '+f.hand+' hand work left';
  if(r.over)m+='. Storage full: '+r.over+' units sold at 70%';
  if(r.err)m+='. '+r.err;
  toast(m+'.');
}
function plotClick(f,i){
  if(!f)return;
  const pl=f.plots[i];
  if(pl.s===2&&pl.p<pl.need){S.ui.plot={f:f.id,i:i};return;}
  if(f.hand<=0){toast('No hand work left on this farm this week. Deploy a machine or press Next week.','warn');return;}
  if(pl.s===0){f.plots[i]={s:1};f.hand--;S.ui.plot=null;return;}
  if(pl.s===1){const err=plantPlot(f,i,S.ui.crop);if(err)toast(err,'warn');else{f.hand--;S.ui.plot=null;}return;}
  const r=harvestPlot(f,i);
  if(r){f.hand--;toast('Harvested '+r.n+' '+CROPS[r.crop].name.toLowerCase()+(r.over?'. Storage was full, so '+r.over+' sold at 70%.':'.'));}
}
function act(a,d){
  const key=ck(a,d.id||'',d.i||'');
  if(CONFIRM.has(a)){
    if(UI.confirm!==key){
      UI.confirm=key;clearTimeout(confirmTimer);
      confirmTimer=setTimeout(()=>{UI.confirm=null;render();},4500);
      render();return;
    }
    UI.confirm=null;
  }else UI.confirm=null;
  const f=d.id?S.farms.find(x=>x.id===+d.id):null;
  switch(a){
    case'tab':S.ui.tab=d.id;break;
    case'autop':{const ff=S.farms.find(x=>x.id==d.id);if(ff){ff.auto=!ff.auto;toast(ff.auto?ff.name+' now runs on autopilot each week.':'Autopilot off.');}break;}
    case'cAccept':{ensureC();const o=S.cOffers.find(x=>x.id==d.id);if(!o)break;if(S.contracts.length>=3){toast('You already hold 3 contracts.','warn');break;}
      S.contracts.push({id:o.id,crop:o.crop,qty:o.qty,reward:o.reward,due:S.week+o.len});S.cOffers=S.cOffers.filter(x=>x.id!==o.id);
      toast('Contract accepted: '+o.qty+' '+CROPS[o.crop].name.toLowerCase()+' by week '+(S.week+o.len)+'.');break;}
    case'cDeliver':{ensureC();const c=S.contracts.find(x=>x.id==d.id);if(!c)break;
      if(S.stock[c.crop]<c.qty){toast('Not enough '+CROPS[c.crop].name.toLowerCase()+' in storage yet.','warn');break;}
      S.stock[c.crop]-=c.qty;S.cash+=c.reward;S.cur.income+=c.reward;gain(c.reward/15);S.cDone++;S.contracts=S.contracts.filter(x=>x.id!==c.id);
      toast('Contract delivered. You earned '+money(c.reward)+'.');break;}
    case'free':{S.free=!S.free;if(S.free){S.cash=1e9;toast('Unlimited money is on.');}else{S.cash=20000;toast('Unlimited money is off. Cash set to $20,000.');}break;}
    case'ordSet':{S.orders=S.orders||{};const k=d.id;S.orders[k]={t:Math.round(price(k)*1.15*100)/100};toast('Auto-sell set. All '+CROPS[k].name.toLowerCase()+' sells when the price reaches '+money2(S.orders[k].t)+'.');break;}
    case'ordT':{const o=S.orders&&S.orders[d.id];if(o)o.t=Math.max(CROPS[d.id].price*.5,Math.round((o.t+(+d.d)*CROPS[d.id].price*.05)*100)/100);break;}
    case'ordOff':{if(S.orders)delete S.orders[d.id];toast('Auto-sell cancelled.');break;}
    case'band':UI.bandOpen=!UI.bandOpen;break;
    case'guide':UI.guideOff=!UI.guideOff;UI.guideKey='';break;
    case'next':nextWeek();notifyWeek();break;
    case'auto':setAuto(!UI.auto);break;
    case'speed':S.ui.speed=S.ui.speed===1?2:S.ui.speed===2?4:1;if(UI.auto)setAuto(true);break;
    case'crop':if(lvl()>=CROP_LV[d.id])S.ui.crop=d.id;else toast('Unlocks at level '+CROP_LV[d.id]+'.','warn');break;
    case'farm':S.ui.farm=+d.id;S.ui.plot=null;break;
    case'plot':plotClick(f,+d.i);break;
    case'job':if(f&&JOBS[d.job])afterJob(f,d.job,runJob(f,d.job));break;
    case'clearPlot':if(f){f.plots[+d.i]={s:1};S.ui.plot=null;toast('Crop ploughed under. The plot is ready to sow again.');}break;
    case'hire':{
      if(!f)break;
      const t=WK[+d.k];if(!t)break;
      if(lvl()<t.lv){toast(t.role+' unlocks at level '+t.lv+'.','warn');break;}
      if(wk(f).length>=maxCrew()){toast('Your crew is full for your level.','warn');break;}
      if(S.cash<t.fee){toast('Not enough cash.','warn');break;}
      S.cash-=t.fee;
      const w={id:S.nextId++,name:pick(WNAMES),t:+d.k,skin:pick(SKINS),shirt:pick(SHIRTS),hat:pick(HATS)};
      wk(f).push(w);f.hand+=t.hand;gain(10);
      toast(w.name+' joined '+f.name+' as a '+t.role.toLowerCase()+'.');break;}
    case'buyAn':{
      if(!f)break;
      const A=ANIM[d.k];if(!A)break;
      const a=an(f);
      if(lvl()<A.lv){toast(apl(A)+' unlock at level '+A.lv+'.','warn');break;}
      if((a[d.k]||0)>=10){toast('The pen is full.','warn');break;}
      if(S.cash<A.price){toast('Not enough cash.','warn');break;}
      S.cash-=A.price;a[d.k]=(a[d.k]||0)+1;gain(5);
      toast('Bought a '+A.name.toLowerCase()+' for '+money(A.price)+'.');break;}
    case'sellAn':{
      if(!f)break;
      const A=ANIM[d.k],a=an(f);
      if(A&&a[d.k]>0){a[d.k]--;const v=Math.round(A.price*.7);S.cash+=v;toast('Sold a '+A.name.toLowerCase()+' for '+money(v)+'.');}
      break;}
    case'fire':{
      if(!f)break;
      const k=wk(f).findIndex(x=>x.id===+d.i);
      if(k>-1){const w=f.workers.splice(k,1)[0];f.hand=Math.min(f.hand,handMax(f));toast(w.name+' has left the crew.');}
      break;}
    case'mgr':
      if(f){f.manager=!f.manager;toast(f.manager?'Manager hired at '+money(mgrWage(f))+' a week.':'Manager dismissed.');}
      break;
    case'upg':
      if(!f)break;
      if(d.k==='expand'){
        const cost=Math.round(4*1200*f.soil);
        if(f.plots.length>=40)toast('This farm is at its maximum size.','warn');
        else if(S.cash<cost)toast('Not enough cash.','warn');
        else{S.cash-=cost;for(let n=0;n<4;n++)f.plots.push({s:0});toast('Added 4 plots to '+f.name+'.');}
      }else if(UPG[d.k]&&!f[d.k]){
        const u=UPG[d.k];
        if(S.cash<u.cost)toast('Not enough cash.','warn');
        else{S.cash-=u.cost;f[d.k]=true;toast(u.name+' installed at '+f.name+'.');}
      }
      break;
    case'sellFarm':
      if(!f)break;
      {const v=farmSell(f);S.cash+=v;S.farms=S.farms.filter(x=>x.id!==f.id);S.vehicles.forEach(m=>{if(m.farm===f.id)m.farm=null;});S.ui.farm=S.farms.length?S.farms[0].id:null;S.ui.plot=null;log('Sold '+f.name+' for '+money(v)+'.');toast('Sold '+f.name+' for '+money(v)+'.');}
      break;
    case'buyFarm':{
      const l=S.listings.find(x=>x.id===+d.id);
      if(!l)break;
      if(S.cash<l.price){toast('Not enough cash.','warn');break;}
      S.cash-=l.price;
      const nf=makeFarm(l.name,l.plots,l.soil,l);
      S.farms.push(nf);S.listings=S.listings.filter(x=>x.id!==l.id);
      S.ui.farm=nf.id;S.ui.tab='farms';S.ui.plot=null;
      gain(25);log('Bought '+l.name+' for '+money(l.price)+'.','good');toast('You bought '+l.name+'. The land is wild, so start by ploughing.');
      break;}
    case'sellCrop':{
      const k=d.id,qty=Math.floor(S.stock[k]*(+d.pct)/100);
      const rev=sell(k,+d.pct===100?S.stock[k]:Math.max(1,qty));
      if(rev){toast('Sold '+CROPS[k].name.toLowerCase()+' for '+money(rev)+'.');if(deployed('truck'))setAnim('truck',null,null,'crops');}
      break;}
    case'sellAll':{
      let tot=0;CROP_KEYS.forEach(k=>{tot+=sell(k,S.stock[k]);});
      if(tot){toast('Sold all stored crops for '+money(tot)+'.');if(deployed('truck'))setAnim('truck',null,null,'crops');}
      break;}
    case'buyVeh':{
      const V=VEH[d.id];
      if(!V)break;
      if(lvl()<VEH_LV[d.id]){toast(V.name+' unlocks at level '+VEH_LV[d.id]+'.','warn');break;}
      if(S.cash<V.price){toast('Not enough cash.','warn');break;}
      S.cash-=V.price;S.vehicles.push({id:S.nextId++,type:d.id,age:0,farm:null});
      log('Bought a '+V.name.toLowerCase()+'. Deploy it to a farm to use it.','good');toast(V.name+' bought. Deploy it to a farm to use it.');
      break;}
    case'buyUsed':{
      const u=S.used.find(x=>x.id===+d.id);
      if(!u)break;
      if(S.cash<u.price){toast('Not enough cash.','warn');break;}
      S.cash-=u.price;S.vehicles.push({id:S.nextId++,type:u.type,age:u.age,farm:null});
      S.used=S.used.filter(x=>x.id!==u.id);
      log('Bought a used '+VEH[u.type].name.toLowerCase()+'. Deploy it to a farm to use it.','good');toast('Used '+VEH[u.type].name.toLowerCase()+' bought. Deploy it to a farm to use it.');
      break;}
    case'deploy':{
      const v=S.vehicles.find(x=>x.id===+d.id);
      if(!v)break;
      if(!d.farm){v.farm=null;toast(VEH[v.type].name+' returned to the garage.');break;}
      const tf=S.farms.find(x=>x.id===+d.farm);
      if(!tf)break;
      if(farmHas(tf,v.type)){toast(tf.name+' already has a '+VEH[v.type].name.toLowerCase()+'.','warn');break;}
      v.farm=tf.id;toast(VEH[v.type].name+' is now working at '+tf.name+'.');
      break;}
    case'sellVeh':{
      const v=S.vehicles.find(x=>x.id===+d.id);
      if(!v)break;
      const val=vehSell(v);S.cash+=val;S.vehicles=S.vehicles.filter(x=>x.id!==v.id);
      log('Sold the '+VEH[v.type].name.toLowerCase()+' for '+money(val)+'.');toast('Sold for '+money(val)+'.');
      break;}
    case'borrow':{
      const amt=+d.amt,room=creditLimit()-S.loan;
      if(amt>room){toast('That is over your credit limit.','warn');break;}
      S.loan+=amt;S.cash+=amt;toast('Borrowed '+money(amt)+'.');
      break;}
    case'repay':{
      let amt=d.amt==='all'?S.loan:Math.min(+d.amt,S.loan);
      amt=Math.min(amt,Math.max(0,Math.floor(S.cash)));
      if(amt<=0){toast('You have no cash to repay with.','warn');break;}
      S.loan-=amt;S.cash-=amt;toast('Repaid '+money(amt)+'.');
      break;}
    case'newGame':case'restart':setAuto(false);newGame();break;
  }
  render();save();
}
function onClick(e){
  const b=e.target&&e.target.closest?e.target.closest('[data-a]'):null;
  if(!b||b.disabled)return;
  act(b.dataset.a,b.dataset);
}

/* ---------- boot ---------- */
if(!load())newGame();
document.addEventListener('click',onClick);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&UI.auto){setAuto(false);render();}});
render();
</script>
