<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#14213d;--mu:#64748b;--ac:#0b6e4f;--acx:#fff;--bd:#dde3ea;--wr:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#192431;--tx:#e8eef5;--mu:#93a1b2;--ac:#34c38f;--acx:#04210f;--bd:#2a3a4d;--wr:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:70px}
h2{margin:.2em 0 .6em;font-size:1.15rem}.wrap{max-width:760px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.r1{margin-bottom:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.sv{display:flex;flex-wrap:wrap;gap:8px}.sv button{flex:1 1 140px;text-align:left}.sv small{display:block;color:var(--mu)}
.ln{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.ln span:first-child{flex:1}
.tt{display:flex;justify-content:space-between;padding:3px 0}.tt.b{font-weight:700;font-size:1.2rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px}nav button.on{color:var(--ac);font-weight:700}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.due{color:var(--wr);font-weight:600}.mu{color:var(--mu);font-size:.85rem}
.lock{max-width:320px;margin:20vh auto;text-align:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .card{margin:0}.k b{font-size:1.25rem}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hd{text-align:center;font-size:.72rem;color:var(--mu)}
.cd{min-height:54px;padding:4px;border-radius:8px;text-align:left;font-size:.9rem;line-height:1.2}.cd small{color:var(--mu);font-size:.62rem}
.cd.t{border:2px solid var(--ac)}.cd.s{background:var(--ac);color:var(--acx)}.cd.s small,.cd.s b{color:inherit!important}
.dot{display:inline-block;background:var(--wr);color:#fff;border-radius:99px;font-size:.6rem;padding:0 5px}
.bars{display:flex;gap:6px;align-items:flex-end;height:125px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.bars i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.bars small{font-size:.62rem;color:var(--mu)}
nav button{font-size:.76rem}
:root{--ac:#0f766e;--bg:#eef3f6;--bd:#dbe5ea}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#2dd4bf;--acx:#042f2e;--bg:#0b1219;--card:#142029;--bd:#25384a}}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:100px}
.hero{background:linear-gradient(135deg,#0b5d56,#0f9d8a 60%,#34c3a0);color:#fff;padding:20px 18px 52px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 28px 28px}
.hero small{display:block;opacity:.85;font-size:.75rem}.hero b{font-size:1.25rem}.hero .mt{text-align:right}.hero .mt b{font-size:1rem}
.wrap{margin-top:-34px;position:relative}
.card{border:0;border-radius:18px;box-shadow:0 6px 20px rgba(15,60,70,.09);padding:14px}
@media(prefers-color-scheme:dark){.card{border:1px solid var(--bd);box-shadow:none}}
h2{font-size:1.05rem;font-weight:700}
input,select,textarea{border-radius:12px;padding:12px;border:1.5px solid var(--bd)}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(20,184,166,.25)}
button{border-radius:12px;transition:transform .08s}button:active{transform:scale(.96)}
button.p{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0;padding:14px;font-size:1rem;box-shadow:0 8px 18px rgba(15,118,110,.3)}
.sv button{border:1.5px solid var(--bd);border-radius:14px;padding:12px}
.sv button:active{border-color:var(--ac);background:rgba(20,184,166,.12)}
.sv small{color:var(--ac);font-weight:700;margin-top:2px}
.ln{border-bottom:1px dashed var(--bd)}
nav{left:10px;right:10px;bottom:10px;border-radius:22px;border:1px solid var(--bd);box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px;margin-bottom:env(safe-area-inset-bottom,0px)}
nav button{font-size:.66rem;line-height:1.25;padding:8px 2px;border-radius:16px;font-weight:600;color:var(--mu)}
nav button span{font-size:1.3rem}nav button.on{color:var(--ac);background:rgba(20,184,166,.15)}
.g .card:nth-child(1){background:linear-gradient(135deg,#0b5d56,#14b8a6);color:#fff}.g .card:nth-child(1) .mu{color:#d7fff5}
.g .card:nth-child(2){border-left:5px solid #3b82f6}.g .card:nth-child(3){border-left:5px solid #ef4444}.g .card:nth-child(4){border-left:5px solid #f59e0b}
.tag{border:0;padding:3px 10px;font-weight:600}.s_Received{background:rgba(59,130,246,.2)}.s_Processing{background:rgba(245,158,11,.25)}.s_Ready{background:rgba(20,184,166,.28)}.s_Delivered{background:rgba(100,116,139,.22)}
.cd{border-radius:12px}.cd.s{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.bars i{background:linear-gradient(180deg,#2dd4bf,#0f766e)}
.lock{margin-top:15vh;padding:28px;border-radius:24px}
#rcpt{display:none}
@media print{body>*{display:none!important}#rcpt{display:block!important;color:#000;background:#fff;font:13px/1.35 monospace;width:76mm;margin:0}#rcpt .tt{display:flex;justify-content:space-between}#rcpt hr{border:0;border-top:1px dashed #000}}
/* ===== Icons ===== */
.ic{flex:none}
button .ic{display:inline-block;vertical-align:-3px;margin-right:4px}
button.p{display:inline-flex;align-items:center;justify-content:center;gap:8px}button.p .ic{margin:0;vertical-align:baseline}
button.p:disabled{opacity:.45;box-shadow:none}
nav{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:rgba(20,32,41,.72)}}
nav button .ic{display:block;margin:0 auto 3px;vertical-align:baseline}
nav button.on .ic{stroke-width:2.1}
.ib{width:34px;height:34px;padding:0;border-radius:99px;display:inline-grid;place-items:center;border:0;background:rgba(120,140,155,.18);color:var(--tx);flex:none}
.ib .ic{margin:0;vertical-align:baseline}
.brand{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#0b5d56,#14b8a6 70%,#5eead4);box-shadow:0 10px 24px rgba(15,118,110,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.brand .ic{display:block;margin:0}
.brand.sm{width:42px;height:42px;border-radius:13px;margin:0;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hb{display:flex;align-items:center;gap:12px}
h2,h3{letter-spacing:-.015em}

/* ===== Delivery field ===== */
.dfield{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--bg)}
.dfield .ic{margin:0;vertical-align:baseline;display:block}
.dfield>.ic:first-child{color:var(--ac)}
.dfield .dv{flex:1;min-width:0}.dfield b{display:block;font-size:.95rem}.dfield small{display:block;color:var(--mu);font-size:.78rem;margin-top:1px}
.dfield .ph{color:var(--mu);font-weight:600}
.dfield>.ic:last-child{color:var(--mu)}

/* ===== Delivery chip on orders ===== */
.dchip{display:flex;align-items:center;gap:10px;margin:8px 0;padding:9px 12px;border-radius:14px;background:rgba(20,184,166,.1)}
.dchip>div{flex:1;min-width:0}.dchip b{display:block;font-size:.86rem}.dchip small{color:var(--mu);font-size:.75rem}
.dchip>.ic{color:var(--ac)}
.dchip em{font-style:normal;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(20,184,166,.22);white-space:nowrap}
.dchip.late{background:rgba(239,68,68,.1)}.dchip.late em{background:rgba(239,68,68,.2);color:var(--wr)}.dchip.late>.ic{color:var(--wr)}
.dchip.now{background:rgba(245,158,11,.14)}.dchip.now em{background:rgba(245,158,11,.32)}.dchip.now>.ic{color:#d97706}
.dchip.ok{background:rgba(100,116,139,.12)}.dchip.ok em{background:rgba(100,116,139,.22)}.dchip.ok>.ic{color:var(--mu)}

/* ===== Bottom sheet ===== */
.pk{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;visibility:hidden;pointer-events:none;transition:visibility 0s linear .5s}
.pk.open{visibility:visible;pointer-events:auto;transition:none}
.pk .scrim{position:absolute;inset:0;background:rgba(8,20,28,.42);opacity:0;transition:opacity .35s ease}
.pk.open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;overscroll-behavior:contain;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;
 background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
 box-shadow:0 -14px 44px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.8);transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);will-change:transform}
.pk.open .sheet{transform:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet{background:rgba(20,32,41,.84);box-shadow:0 -14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}}
#hdl{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--mu);opacity:.4;margin:8px auto 2px}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}.sh-h h3{margin:0;font-size:1.2rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-weight:600;font-size:.85rem;border:1.5px solid var(--bd);background:transparent}
.chip.s{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.mon{display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px}.mon>div{text-align:center}.mon b{display:block;letter-spacing:-.01em}.mon small{color:var(--mu);font-size:.75rem}
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pd{position:relative;aspect-ratio:1/1.1;padding:2px;border-radius:14px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .1s,background .15s}
.pd b{font-size:1.02rem}.pd small{font-size:.58rem;color:var(--mu)}.pd.sat b{color:var(--wr)}
.pd.t{box-shadow:inset 0 0 0 2px var(--ac)}
.pd.s{background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 6px 14px rgba(15,118,110,.35)}.pd.s b,.pd.s small{color:#fff}
.pd:disabled{opacity:.28;cursor:default}
.pd .ld{position:absolute;top:2px;right:4px;font-style:normal;font-size:.56rem;font-weight:700;background:#f59e0b;color:#1c1300;border-radius:99px;min-width:15px;padding:0 4px;line-height:15px;text-align:center}
.pk-sum{display:flex;gap:12px;align-items:center;margin:12px 0;padding:12px 14px;border-radius:16px;background:rgba(20,184,166,.13)}
.pk-sum>.ic{color:var(--ac)}.pk-sum b{display:block}.pk-sum small{display:block;color:var(--mu);font-size:.78rem}
.pk-sum.empty{display:block;color:var(--mu);font-size:.88rem}

@media(prefers-reduced-motion:reduce){
 .sheet{transform:none;opacity:0;transition:opacity .2s ease}.pk.open .sheet{opacity:1}
 button:active,.pd{transform:none;transition:none}
}
@media(prefers-reduced-transparency:reduce){
 .sheet,nav,.brand.sm{-webkit-backdrop-filter:none;backdrop-filter:none}
 .sheet,nav{background:var(--card)}
}
/* ===== v2 ===== */
.billno{display:flex;justify-content:space-between;align-items:center;gap:10px}
.billno small{display:block;color:var(--mu);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.billno b{font-size:1.15rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.billno>div:last-child{text-align:right}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1 1 140px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600;transition:transform .08s}
a.btn:active{transform:scale(.96)}a.btn .ic{display:block}
a.btn.wa{color:#128c7e;border-color:rgba(18,140,126,.45);background:rgba(18,140,126,.08)}
.note{display:flex;gap:6px;align-items:flex-start;margin:6px 0;color:var(--mu);font-size:.85rem}.note .ic{margin:2px 0 0;flex:none}
.chip .cn{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:rgba(120,140,155,.2);font-size:.72rem;text-align:center}
.chip.s .cn{background:rgba(255,255,255,.28)}

.cta b,.tt.b{font-variant-numeric:tabular-nums}

.tiles button.in{border-color:var(--ac);background:rgba(20,184,166,.1)}
.qb{position:absolute;top:-7px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--ac);color:var(--acx);font:700 .78rem/24px system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.qb.pop{animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.r3{display:grid;grid-template-columns:1fr 96px 46px;gap:8px;margin-top:12px}
button.sq{padding:0;width:46px;border-radius:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.lnk{border:0;background:none;color:var(--ac);font-weight:600;padding:12px 0 2px}
.ln .ib{background:rgba(120,140,155,.18)}
.cta{position:fixed;left:10px;right:10px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:22px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bd);box-shadow:0 10px 28px rgba(0,0,0,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta{background:rgba(20,32,41,.8)}}
.cta small{display:block;color:var(--mu);font-size:.72rem}.cta b{font-size:1.3rem;letter-spacing:-.02em}
.cta .p{padding:13px 20px;white-space:nowrap}
.oc{padding:0!important;overflow:hidden}
.oh{display:block;width:100%;text-align:left;border:0;background:none;border-radius:0;padding:14px}
.oh:active{transform:none;background:rgba(20,184,166,.07)}
.o1,.o2,.o3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.o1 b{letter-spacing:-.01em}.o2{margin-top:3px;font-weight:600;font-size:1.04rem}.o3{margin-top:7px}
.okk{color:var(--mu);font-weight:600}
.dp{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(20,184,166,.18)}
.dp .ic{margin:0;vertical-align:baseline}
.dp.late{background:rgba(239,68,68,.15);color:var(--wr)}.dp.now{background:rgba(245,158,11,.24)}.dp.ok{background:rgba(100,116,139,.16);color:var(--mu)}
.ob{padding:0 14px 14px;animation:ex .3s cubic-bezier(.32,.72,0,1)}
@keyframes ex{from{opacity:0;transform:translateY(-8px)}}
.steps{display:flex;gap:4px;margin:12px 0 10px;padding:4px;border-radius:15px;background:rgba(120,140,155,.14)}
.stp{flex:1;border:0;background:transparent;padding:9px 2px;font-size:.74rem;font-weight:600;color:var(--mu);border-radius:11px}
.stp.done{color:var(--ac)}.stp.cur{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.paybtn{width:100%;margin-top:8px;color:var(--ac);border-color:var(--ac);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.paybtn .ic{margin:0;vertical-align:baseline}
button.danger{color:var(--wr)}
.empty{text-align:center;color:var(--mu);padding:48px 0}.empty .ic{margin:0 auto 8px;opacity:.6;display:block}
